name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: traceforge-linux-amd64
          - goos: linux
            goarch: arm64
            output: traceforge-linux-arm64
          - goos: darwin
            goarch: amd64
            output: traceforge-darwin-amd64
          - goos: darwin
            goarch: arm64
            output: traceforge-darwin-arm64
          - goos: windows
            goarch: amd64
            output: traceforge-windows-amd64.exe
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o "dist/${{ matrix.output }}" ./cmd/traceforge

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: traceforge-*
          path: dist
          merge-multiple: true

      - name: Create checksum file
        working-directory: dist
        run: sha256sum traceforge-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "TraceForge ${GITHUB_REF_NAME}"
